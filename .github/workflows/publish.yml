name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync and test
        run: |
          uv sync --all-groups
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # Requires a GitHub Environment named "pypi" with Trusted Publisher
        # configured for this repo on https://pypi.org/manage/account/publishing/
        run: uv publish
