[project]
name = "fictionreaper"
version = "0.1.0"
description = "Download Royal Road fiction chapters as Markdown (CLI + FastAPI)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Fluder-Paradyne", email = "121793617+Fluder-Paradyne@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["royal-road", "web-fiction", "scraper", "markdown", "epub-later"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "markdown>=3.10.2",
    "pydantic>=2",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/Fluder-Paradyne/FictionReaper"
Repository = "https://github.com/Fluder-Paradyne/FictionReaper"
Issues = "https://github.com/Fluder-Paradyne/FictionReaper/issues"

[project.scripts]
fictionreaper = "fictionreaper.cli:run"

[build-system]
requires = ["uv_build>=0.8.24,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "types-beautifulsoup4>=4.12",
    "types-markdown>=3.10.2.20260712",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fictionreaper"]
mypy_path = "src"
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[[tool.mypy.overrides]]
module = ["ebooklib", "ebooklib.*"]
ignore_missing_imports = true
