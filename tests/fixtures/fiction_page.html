<script type="application/ld+json">{"@context":"https://schema.org","@type":"Book","name":"Mother of Learning","description":"\u003Cp\u003EZorian is a teenage mage of humble birth and slightly above-average skill, attending his third year of education at Cyoria\u0027s magical academy. He is a driven and irritable young man, consumed by a desire to ensure his own future and free himself of the influence of his family, whom he resents for favoring his brothers over him. Consequently, he has no time for pointless distractions or paying attention to other people\u0027s problems.\u003C/p\u003E\n\u003Cp\u003EAs it happens, time is something he is about to get plenty of. On the eve of the Cyoria\u0027s annual summer festival, he is killed and brought back to the beginning of the month, just before he was about to take a train to Cyoria. Suddenly trapped in a time loop with no clear end or exit, Zorian will have to look both within and without to unravel the mystery before him. And he does have to unravel it, for the time loop hadn\u0027t been made for his sake and dangers lurk everywhere...\u003C/p\u003E\n\u003Cp\u003ERepetition is the mother of learning, but Zorian will have to first make sure he survives to try again - in a world of magic, even a time traveler isn\u0027t safe from those who wish him ill.\u003C/p\u003E\n\u003Cp\u003E**********************************\u003C/p\u003E\n\u003Cp\u003EMother of Learning is now \u003Ca href=\u0022https://www.amazon.com/dp/B09M2R6QLF/\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Eavailable for sale on Amazon\u003C/a\u003E. The story will remain available in full here on Royal Road and on Fictionpress, but if you\u0027re more interested to read the story as a Kindle Edition e-book you now have a way to do that.\u003C/p\u003E\n\u003Cp\u003EThe audiobooks can be found \u003Ca href=\u0022https://www.audible.com/author/Domagoj-Kurmaic/B09M8ZV2J2\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Eon this link here\u003C/a\u003E. The physical edition is available through a Kickstarter campaign, which \u003Ca href=\u0022https://www.kickstarter.com/projects/wraithmarked/mol3and4\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Ecan be found here\u003C/a\u003E.\u003C/p\u003E\n\u003Cp\u003EI will keep you all updated on that as things develop.\u003C/p\u003E\n\u003Cp\u003E**********************************\u003C/p\u003E\n\u003Cp\u003EIf anyone is interested, I have a story-related worldbuilding site that can be found \u003Ca href=\u0022https://motheroflearninguniverse.wordpress.com/\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Ehere\u003C/a\u003E. I don\u0027t update it as often as I should, but there is a fair amount of content there already. It also contains a page with all the fanart, fan translations, audio books and the like - you can reach it directly by clicking \u003Ca href=\u0022https://motheroflearninguniverse.wordpress.com/2016/05/01/mol-links-fanart-translation-etc/\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Ethis link\u003C/a\u003E.\u003C/p\u003E\n\u003Cp\u003EI have a \u003Ca href=\u0022https://www.patreon.com/nobody103\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Epatreon account\u003C/a\u003E for those kind people that want to give me money. It also contains info for those who want to donate via paypal.\u003C/p\u003E\n\u003Cp\u003EThe story was originally posted on fictionpress, back in 2011. When I reached chapter 91, I started uploading the story to RoyalRoad, one chapter per day. The Fictionpress version of the story can be reached by clicking on \u003Ca href=\u0022https://www.fictionpress.com/~nobody103\u0022 rel=\u0022noopener ugc nofollow\u0022\u003Ethis link\u003C/a\u003E if somebody is interested, though at this point there is nothing there that isn\u0027t also on RoyalRoad.\u003C/p\u003E","image":"https://www.royalroadcdn.com/public/covers-full/21220-mother-of-learning.jpg?time=1637247458","mainEntityOfPage":"https://www.royalroad.com/fiction/21220/mother-of-learning","potentialAction":{"@type":"ReadAction","name":"Mother of Learning","target":{"@type":"EntryPoint","actionPlatform":["http://schema.org/DesktopWebPlatform","http://schema.org/MobileWebPlatform","http://schema.org/AndroidPlatform","http://schema.org/iOSPlatform"],"urlTemplate":"https://www.royalroad.com/fiction/21220/mother-of-learning/chapter/301778/1-good-morning-brother"}},"url":"https://www.royalroad.com/fiction/21220/mother-of-learning","accountablePerson":{"@type":"Person","@id":"/profile/100374","name":"nobody103","url":"https://www.royalroad.com/profile/100374"},"aggregateRating":{"@type":"AggregateRating","bestRating":5,"ratingValue":4.83,"worstRating":0.5,"ratingCount":17192},"author":{"@type":"Person","@id":"/profile/100374","name":"nobody103","url":"https://www.royalroad.com/profile/100374"},"copyrightHolder":{"@type":"Person","@id":"/profile/100374","name":"nobody103","url":"https://www.royalroad.com/profile/100374"},"copyrightYear":2018,"dateCreated":"2018-10-28T21:34:43+00:00","dateModified":"2023-07-06T17:47:41+00:00","datePublished":"2018-10-28T21:34:43+00:00","genre":"https://www.royalroad.com/fictions/best-rated?genre=loop","headline":"Mother of Learning","inLanguage":"en-US","interactionStatistic":{"@type":"InteractionCounter","interactionType":{"@type":"ReadAction"},"userInteractionCount":27501122},"isAccessibleForFree":true,"isFamilyFriendly":true,"publisher":{"@type":"Organization","name":"Royal Road","url":"https://www.royalroad.com/","areaServed":"Global","legalName":"Not Yet Media LTD","logo":"https://www.royalroad.com/dist/img/logo/rr-logo-square-silver-gold-large.png"},"publishingPrinciples":"https://www.royalroad.com/support/knowledgebase/114","thumbnailUrl":"https://www.royalroadcdn.com/public/covers-full/21220-mother-of-learning.jpg?time=1637247458","numberOfPages":2932}</script>
